input {
  # Listen for logs from your Node app via TCP
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Tag errors so they are easy to find in Kibana
  if [level] == "error" {
    mutate {
      add_tag => ["error_log"]
    }
  }
}

output {
  # Send to Elasticsearch (Database)
  elasticsearch {
    hosts => ["http://elasticsearch:9200"] 
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug: Print to Docker console to prove it's receiving data
  stdout { codec => rubydebug }
}